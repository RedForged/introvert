name: Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run verification tests
        run: npm test

  build-android:
    name: Build & Sign Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform & NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" "ndk;27.0.12077973" || true
          NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android Targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Frontend Assets
        run: npm run build

      - name: Initialize Android Target
        run: |
          npx @tauri-apps/cli android init --ci --skip-targets-install

      - name: Configure Android Native Customizations
        run: |
          mkdir -p src-tauri/gen/android/app/src/main/res/xml
          mkdir -p src-tauri/gen/android/app/src/main/res/values
          mkdir -p src-tauri/gen/android/app/src/main/res/values-night
          mkdir -p src-tauri/gen/android/app/src/main/java/eu/redforged/introvert

          cp scripts/android/network_security_config.xml src-tauri/gen/android/app/src/main/res/xml/network_security_config.xml
          cp scripts/android/MainActivity.kt src-tauri/gen/android/app/src/main/java/eu/redforged/introvert/MainActivity.kt
          cp scripts/android/themes.xml src-tauri/gen/android/app/src/main/res/values/themes.xml
          cp scripts/android/themes-night.xml src-tauri/gen/android/app/src/main/res/values-night/themes.xml
          cp scripts/android/build.gradle.kts src-tauri/gen/android/app/build.gradle.kts

          sed -i 's|android:usesCleartextTraffic="${usesCleartextTraffic}"|android:networkSecurityConfig="@xml/network_security_config"|' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          sed -i 's|android:name=".MainActivity"|android:name=".MainActivity" android:windowSoftInputMode="adjustResize"|' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          grep -q networkSecurityConfig src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build Android APK
        run: |
          npx @tauri-apps/cli android build --apk --ci --debug
          npx @tauri-apps/cli android build --apk --ci || true

      - name: Sign Android APKs with apksigner
        run: |
          KEYSTORE_DIR="$HOME/.android"
          KEYSTORE_FILE="$KEYSTORE_DIR/debug.keystore"
          mkdir -p "$KEYSTORE_DIR"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            keytool -genkey -v -keystore "$KEYSTORE_FILE" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" ! -name "*-unaligned.apk"); do
            echo "--- Signing $apk ---"
            $APKSIGNER sign --ks "$KEYSTORE_FILE" --ks-pass pass:android --key-pass pass:android "$apk" || true
            echo "--- Verifying $apk ---"
            $APKSIGNER verify -v "$apk" || true
          done

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: introvert-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: 'Introvert ${{ github.ref_name }}'
          body: 'Introvert automated release featuring dynamic edge-to-edge Android system bar safe-area integration and signed APKs.'
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
