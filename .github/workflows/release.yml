name: Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run verification tests
        run: npm test

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-universal'
            os: macos-latest
            args: '--target universal-apple-darwin'
            target: 'aarch64-apple-darwin x86_64-apple-darwin'

          - platform: 'linux-x86_64'
            os: ubuntu-22.04
            args: ''
            target: 'x86_64-unknown-linux-gnu'

          - platform: 'windows-x86_64'
            os: windows-latest
            args: ''
            target: 'x86_64-pc-windows-msvc'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Targets
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Tauri Application & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          releaseName: 'RedForged/introvert v__VERSION__'
          releaseBody: 'Introvert automated cross-platform release with end-to-end encrypted direct messaging, rooms, and WebRTC calls.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: introvert-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/universal-apple-darwin/release/bundle/
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform & NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "ndk;27.0.12077973" || true
          NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust Android Targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Build Frontend Assets
        run: npm run build

      - name: Initialize Android Target
        run: |
          npx @tauri-apps/cli android init --ci --skip-targets-install

      - name: Build Android APK
        run: |
          npx @tauri-apps/cli android build --apk --ci --debug
          npx @tauri-apps/cli android build --apk --ci || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: introvert-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          draft: true
