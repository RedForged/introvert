[package]
name = "introvert"
version = "1.0.20"
description = "Minimalist E2EE Chat, Rooms and WebRTC Calls client for Extrovert"
authors = ["Introvert Team"]
edition = "2021"

[lib]
name = "introvert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
panic = "abort"
strip = true
